[project]
name = "paycheck-decoder"
version = "0.1.0"
description = "Plain-language pay stub explainer and wage/withholding check for Illinois W-2 workers."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "app"]
